name: Atualizar noticias

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: atualizar-noticias
  cancel-in-progress: true

permissions:
  contents: write


jobs:

  atualizar:

    runs-on: ubuntu-latest


    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4


      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Instalar bibliotecas
        run: |
          pip install feedparser requests beautifulsoup4


      - name: Buscar noticias RSS
        run: |

          python3 <<'PY'

          import json
          import feedparser
          import requests

          from bs4 import BeautifulSoup
          from datetime import datetime



          feeds = {

              "Esportes":
              "https://www.espn.com.br/rss/futebol",

              "Brasil":
              "https://g1.globo.com/rss/g1/",

              "Economia":
              "https://g1.globo.com/rss/g1/economia/",

              "Tecnologia":
              "https://feeds.feedburner.com/tecnoblog",

              "Saúde":
              "https://g1.globo.com/rss/g1/ciencia-e-saude/"

          }




          imagens = {


              "Esportes":
              "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=1200",


              "Brasil":
              "https://images.unsplash.com/photo-1521295121783-8a321d551ad2?w=1200",


              "Economia":
              "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=1200",


              "Tecnologia":
              "https://images.unsplash.com/photo-1518770660439-4636190af475?w=1200",


              "Saúde":
              "https://images.unsplash.com/photo-1505751172876-fa1923c5c528?w=1200"

          }




          def buscar_imagem(item,categoria):


              try:

                  if item.get("media_content"):

                      img=item.media_content[0].get("url")

                      if img:
                          return img

              except:

                  pass



              try:

                  if item.get("media_thumbnail"):

                      img=item.media_thumbnail[0].get("url")

                      if img:
                          return img

              except:

                  pass




              try:

                  pagina=requests.get(

                      item.get("link"),

                      headers={
                          "User-Agent":"Mozilla/5.0"
                      },

                      timeout=8

                  )


                  soup=BeautifulSoup(
                      pagina.text,
                      "html.parser"
                  )


                  og=soup.find(
                      "meta",
                      property="og:image"
                  )


                  if og:

                      return og.get("content")


              except:

                  pass



              return imagens[categoria]





          noticias=[]




          for categoria,url in feeds.items():


              feed=feedparser.parse(url)



              for item in feed.entries[:10]:


                  noticias.append({


                      "title":
                      item.get(
                          "title",
                          "Sem título"
                      ),



                      "description":
                      BeautifulSoup(
                          item.get(
                              "summary",
                              ""
                          ),
                          "html.parser"

                      ).text[:300],



                      "url":
                      item.get(
                          "link",
                          "#"
                      ),



                      "image":
                      buscar_imagem(
                          item,
                          categoria
                      ),



                      "category":
                      categoria,



                      "publishedAt":
                      datetime.utcnow().isoformat()+"Z"


                  })





          with open(
              "news.json",
              "w",
              encoding="utf-8"
          ) as f:


              json.dump(

                  {
                      "articles":noticias
                  },

                  f,

                  ensure_ascii=False,

                  indent=2

              )



          print(
              f"{len(noticias)} noticias criadas"
          )


          PY





      - name: Commit das noticias
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add news.json

          git diff --cached --quiet || git commit -m "Atualizar noticias"



      - name: Enviar alterações
        run: |

          git push
