<title>RD NEWS - Notícias Atualizadas</title>

<meta name="description" content="RD NEWS - Portal inteligente de notícias do Brasil e do mundo.">


<style>


*{

box-sizing:border-box;

font-family:Arial,sans-serif;

}



body{

margin:0;

background:var(--corFundo,#f4f6f9);

color:var(--corTexto,#222);

}



header{

background:var(--corPrincipal,#0b1f3a);

color:white;

padding:25px;

text-align:center;

}



.logo-area img{

width:220px;

height:220px;

object-fit:contain;

}



header p{

opacity:.8;

}



.menu{

display:flex;

gap:10px;

overflow:auto;

padding:15px;

background:white;

}



.menu button{

border:0;

padding:10px 18px;

border-radius:20px;

background:var(--corPrincipal,#0b1f3a);

color:white;

cursor:pointer;

}



.container{

max-width:1100px;

margin:auto;

padding:15px;

}



.destaque{

background:white;

border-radius:15px;

overflow:hidden;

margin-bottom:20px;

}



.destaque img{

width:100%;

height:350px;

object-fit:cover;

}



.destaque h1{

padding:15px;

}



.video-box{

background:white;

padding:20px;

margin:20px 0;

border-radius:15px;

box-shadow:0 2px 8px #ccc;

}



.video-box h2{

margin-bottom:15px;

}



.video-box iframe{

width:100%;

height:400px;

border:0;

border-radius:15px;

}



.noticias{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:20px;

}



.card{

background:white;

border-radius:15px;

overflow:hidden;

box-shadow:0 2px 8px #ccc;

}



.card img{

width:100%;

height:180px;

object-fit:cover;

}



.card div{

padding:15px;

}



.card h2{

font-size:18px;

}



.hora{

color:#777;

font-size:13px;

}



a{

color:#e50914;

font-weight:bold;

}



footer{

background:var(--corPrincipal,#0b1f3a);

color:white;

text-align:center;

padding:20px;

margin-top:30px;

}



.dark{

background:#111;

color:white;

}



.dark .card,

.dark .destaque,

.dark .menu,

.dark .video-box{

background:#222;

color:white;

}



@media(max-width:600px){


.video-box iframe{

height:220px;

}


.logo-area img{

width:150px;

height:150px;

}


}


</style>

<body>


<header>

<div class="logo-area">

<img id="logoSite" src="" alt="Logo RD NEWS">

<h1 id="nomeSite">
RD NEWS
</h1>

</div>


<p>
Seu portal inteligente de notícias
</p>


</header>



<div class="menu">


<button onclick="categoria('todas')">
📰 Todas
</button>


<button onclick="categoria('futebol')">
⚽ Futebol
</button>


<button onclick="categoria('brasil')">
🇧🇷 Brasil
</button>


<button onclick="categoria('mundo')">
🌎 Mundo
</button>


<button onclick="categoria('tecnologia')">
💻 Tecnologia
</button>


<button onclick="categoria('economia')">
💰 Economia
</button>


<button onclick="modo()">
🌙
</button>


</div>



<div class="container">


<div id="destaque"></div>


<div id="videoYoutube"></div>


<div id="anuncio"></div>


<h2>
Últimas notícias
</h2>


<div class="noticias" id="noticias">

Carregando notícias...

</div>


</div>




<script>


let noticias=[];

let categoriaAtual="todas";



fetch("news.json")

.then(res=>res.json())

.then(dados=>{


noticias=dados.articles || [];

mostrar();


})

.catch(()=>{


document.getElementById("noticias").innerHTML =
"Não foi possível carregar as notícias";


});




function embaralhar(lista){

return lista.sort(()=>Math.random()-0.5);

}




function mostrar(){


let lista=[...noticias];


lista=embaralhar(lista);



let area=document.getElementById("noticias");


area.innerHTML="";



lista.forEach(n=>{


area.innerHTML+=`


<div class="card">


<img src="${n.image || 'https://via.placeholder.com/400'}">


<div>


<h2>${n.title}</h2>


<p class="hora">

${data(n.publishedAt)}

</p>


<a href="${n.url}" target="_blank">

Ler notícia

</a>


</div>


</div>


`;


});


let destaque=lista[0];


document.getElementById("destaque").innerHTML=`


<div class="destaque">


<img src="${destaque?.image || 'https://via.placeholder.com/800'}">


<h1>

${destaque?.title || "Sem notícia"}

</h1>


</div>


`;



}



function data(d){

if(!d)
return "Data não informada";


return new Date(d).toLocaleString("pt-BR");

}





function categoria(c){

categoriaAtual=c;

mostrar();

}





function modo(){

document.body.classList.toggle("dark");

}





// CONFIGURAÇÃO DO SITE

fetch("config.json")

.then(res=>res.json())

.then(config=>{



// Nome

if(config.nome){

document.getElementById("nomeSite").innerHTML=config.nome;

}



// Logo

if(config.logo){

document.getElementById("logoSite").src=config.logo;

}




// CORES DO SITE


if(config.tema){


document.documentElement.style.setProperty(
"--corPrincipal",
config.tema.corPrincipal
);


document.documentElement.style.setProperty(
"--corFundo",
config.tema.corFundo
);


document.documentElement.style.setProperty(
"--corTexto",
config.tema.corTexto
);


}





// VÍDEO YOUTUBE AUTOMÁTICO


if(config.video && config.video.ativo){


let link=config.video.youtube;


let videoId="";



if(link.includes("youtu.be")){

videoId=link.split("youtu.be/")[1];

}



if(link.includes("youtube.com")){

videoId=new URL(link).searchParams.get("v");

}




document.getElementById("videoYoutube").innerHTML=`


<div class="video-box">


<h2>

${config.video.titulo || "Vídeo em destaque"}

</h2>


<iframe

src="https://www.youtube.com/embed/${videoId}"

allowfullscreen>

</iframe>


</div>


`;

}




// ANÚNCIO


if(config.anuncio && config.anuncio.ativo){


document.getElementById("anuncio").innerHTML=`


<img src="${config.anuncio.imagem}"

style="width:100%;border-radius:15px;">


`;

}



})


.catch(()=>{

console.log("Erro no config.json");

});



</script>
