<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notícias IA Brasil</title>

<style>

*{
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
margin:0;
background:#f4f4f4;
color:#222;
}


header{
background:#111;
color:white;
padding:25px;
text-align:center;
}


.logo{
font-size:20px;
font-weight:bold;
}


header p{
opacity:.8;
}


.menu{
display:flex;
gap:10px;
overflow:auto;
padding:15px;
background:white;
}


.menu button{

border:0;
padding:10px 18px;
border-radius:20px;
background:#111;
color:white;
cursor:pointer;

}


.container{

max-width:1100px;
margin:auto;
padding:15px;

}


.destaque{

background:white;
border-radius:15px;
overflow:hidden;
margin-bottom:20px;

}


.destaque img{

width:100%;
height:350px;
object-fit:cover;

}


.destaque h1{

padding:15px;

}


.noticias{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;

}


.card{

background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 2px 8px #ccc;

}


.card img{

width:100%;
height:180px;
object-fit:cover;

}


.card div{

padding:15px;

}


.card h2{

font-size:18px;

}


.hora{

color:#777;
font-size:13px;

}


a{

color:#d00;
font-weight:bold;

}


footer{

background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:30px;

}


.dark{

background:#111;
color:white;

}


.dark .card,
.dark .destaque,
.dark .menu{

background:#222;
color:white;

}


</style>

</head>

<body>
 <header>

<div class="logo-area">

<img id="logoSite" src="" alt="Logo do site">

<h1 id="nomeSite">
Notícias IA Brasil
</h1>

</div>

<p>
Seu portal inteligente de notícias
</p>

</header>


<div class="menu">

<button onclick="categoria('todas')">
📰 Todas
</button>

<button onclick="categoria('futebol')">
⚽ Futebol
</button>

<button onclick="categoria('brasil')">
🇧🇷 Brasil
</button>

<button onclick="categoria('mundo')">
🌎 Mundo
</button>

<button onclick="categoria('tecnologia')">
💻 Tecnologia
</button>

<button onclick="categoria('economia')">
💰 Economia
</button>

<button onclick="modo()">
🌙
</button>

</div>



<div class="container">

<div id="destaque"></div>


</div>

<div id="anuncio"></div>

<h2>
Últimas notícias
</h2>


<div class="noticias" id="noticias">

Carregando notícias...

</div>


</div>



<footer>

© 2026 Notícias IA Brasil

</footer>



<script>


let noticias = [];


let categoriaAtual = "todas";



fetch("news.json")

.then(res => res.json())

.then(dados => {


noticias = dados.articles || [];

mostrar();


})

.catch(()=>{


document.getElementById("noticias").innerHTML =
"Erro ao carregar notícias";


});



function embaralhar(lista){

return lista.sort(()=>Math.random()-0.5);

}




function mostrar(){


let lista = [...noticias];


// embaralha

lista = embaralhar(lista);



if(categoriaAtual !== "todas"){


lista = lista.filter(n=>{


let texto =
(n.title+" "+(n.description||""))
.toLowerCase();



if(categoriaAtual=="futebol")
return texto.match(/futebol|gol|time|flamengo|cruzeiro|atletico|brasileirao/);


if(categoriaAtual=="tecnologia")
return texto.match(/tecnologia|celular|internet|ia/);


if(categoriaAtual=="economia")
return texto.match(/economia|dinheiro|mercado/);


if(categoriaAtual=="brasil")
return texto.match(/brasil|governo|política/);


if(categoriaAtual=="mundo")
return texto.match(/mundo|internacional/);


});


}



let destaque = lista[0];



document.getElementById("destaque").innerHTML = `

<div class="destaque">

<img src="${destaque?.image || 'https://via.placeholder.com/800'}">

<h1>${destaque?.title || "Sem notícia"}</h1>

</div>

`;



let area =
document.getElementById("noticias");

area.innerHTML="";



lista.forEach(n=>{


area.innerHTML += `


<div class="card">


<img src="${n.image || 'https://via.placeholder.com/400'}">


<div>


<h2>${n.title}</h2>


<p class="hora">

🕒 ${data(n.publishedAt)}

</p>


<p>

${n.description || ""}

</p>


<a href="${n.url}" target="_blank">

Ler notícia

</a>


</div>


</div>


`;


});


}



function data(d){

if(!d)
return "Horário não informado";


return new Date(d)
.toLocaleString("pt-BR");

}




function categoria(c){

categoriaAtual=c;

mostrar();

}



function modo(){

document.body.classList.toggle("dark");

}

fetch("config.json")
.then(res => res.json())
.then(config => {

if(config.anuncio.ativo){

document.getElementById("anuncio").innerHTML = `

<a href="${config.anuncio.link}" target="_blank">

<img src="${config.anuncio.imagem}" 
style="width:100%;border-radius:15px;">

</a>

`;

}

});
fetch("config.json")
.then(res => res.json())
.then(config => {

document.getElementById("logoSite").src = config.logo;

document.getElementById("nomeSite").innerHTML = config.nome;

});
 </script>
