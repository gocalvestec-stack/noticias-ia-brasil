<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RD NEWS - Portal inteligente de notícias do Brasil e do mundo.">
  <title>RD NEWS - Notícias Atualizadas</title>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9077847530409296" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:Inter,sans-serif;
      background:#f5f7fb;
      color:#111827;
    }

    header{
      background:#0b1f3a;
      color:#fff;
      text-align:center;
      padding:30px 20px;
    }

    header h1{
      margin:0;
      font-size:2rem;
    }

    .menu{
      display:flex;
      gap:10px;
      overflow:auto;
      padding:12px;
      background:#fff;
      border-bottom:1px solid #e5e7eb;
      position:sticky;
      top:0;
      z-index:10;
    }

    .menu button{
      border:none;
      background:#eef2ff;
      color:#111827;
      padding:10px 16px;
      border-radius:999px;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }

    .menu button.active{
      background:#0b1f3a;
      color:#fff;
    }

    .container{
      max-width:1100px;
      margin:24px auto;
      padding:0 16px;
    }

    .hero{
      background:#fff;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 8px 24px rgba(0,0,0,.08);
      margin-bottom:28px;
    }

    .hero img{
      width:100%;
      height:380px;
      object-fit:cover;
      display:block;
    }

    .hero-content{
      padding:24px;
    }

    .tag{
      display:inline-block;
      background:#e50914;
      color:#fff;
      padding:6px 10px;
      border-radius:999px;
      font-size:.75rem;
      font-weight:800;
      margin-bottom:12px;
    }

    .hero h2{
      margin:0 0 12px;
      font-size:1.9rem;
      line-height:1.2;
    }

    .hero p{
      margin:0;
      color:#6b7280;
    }

    .section-title{
      font-size:1.35rem;
      font-weight:800;
      margin:28px 0 18px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:22px;
    }

    .card{
      background:#fff;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 8px 24px rgba(0,0,0,.08);
      display:flex;
      flex-direction:column;
    }

    .card img{
      width:100%;
      height:190px;
      object-fit:cover;
      display:block;
    }

    .card-body{
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
      flex:1;
    }

    .card h3{
      margin:0;
      font-size:1.05rem;
      line-height:1.4;
    }

    .meta{
      margin-top:auto;
      display:flex;
      justify-content:space-between;
      font-size:.82rem;
      color:#6b7280;
    }

    .read{
      color:#e50914;
      font-weight:700;
      text-decoration:none;
    }

    footer{
      background:#0b1f3a;
      color:#fff;
      text-align:center;
      padding:36px 20px;
      margin-top:48px;
    }

    @media(max-width:768px){
      .hero img{height:240px}
      .hero h2{font-size:1.45rem}
    }
  </style>
</head>
<body>

<header>
  <h1>RD NEWS</h1>
  <p>Seu portal inteligente de notícias</p>
</header>

<div class="menu">
  <button class="active" onclick="categoria('todas', this)">📰 Todas</button>
  <button onclick="categoria('futebol', this)">⚽ Futebol</button>
  <button onclick="categoria('brasil', this)">🇧🇷 Brasil</button>
  <button onclick="categoria('mundo', this)">🌎 Mundo</button>
  <button onclick="categoria('economia', this)">💰 Economia</button>
</div>

<div class="container">

  <div id="hero"></div>

  <div class="section-title">Últimas notícias</div>

  <div class="grid" id="noticias">
    Carregando notícias...
  </div>

</div>

<footer>
  <p>© 2026 RD NEWS - Todos os direitos reservados.</p>
</footer>

<script>
let noticias = [];
let categoriaAtual = "todas";

fetch("news.json")
  .then(res => res.json())
  .then(dados => {
    noticias = dados.articles || [];
    renderizar();
  })
  .catch(() => {
    document.getElementById("noticias").innerHTML =
      "<p>Erro ao carregar notícias.</p>";
  });

function renderizar() {
  let lista = [...noticias];

  if (categoriaAtual !== "todas") {
    lista = lista.filter(n =>
      (n.category || "").toLowerCase() === categoriaAtual
    );
  }

  lista.sort((a, b) =>
    new Date(b.publishedAt) - new Date(a.publishedAt)
  );

  const hero = document.getElementById("hero");
  const grid = document.getElementById("noticias");

  if (lista.length === 0) {
    hero.innerHTML = "";
    grid.innerHTML = "<p>Nenhuma notícia encontrada.</p>";
    return;
  }

  const destaque = lista[0];
  const resto = lista.slice(1);

  hero.innerHTML = `
    <article class="hero">
      <a href="${destaque.url}" target="_blank">
        <img loading="lazy" src="${destaque.image || 'https://via.placeholder.com/1200x600'}" alt="Destaque">
      </a>
      <div class="hero-content">
        <span class="tag">Em destaque</span>
        <h2>${destaque.title}</h2>
        <p>${destaque.description || 'Acompanhe os principais acontecimentos do Brasil e do mundo em tempo real.'}</p>
      </div>
    </article>
  `;

  grid.innerHTML = resto.map(n => `
    <article class="card">
      <a href="${n.url}" target="_blank">
        <img loading="lazy" src="${n.image || 'https://via.placeholder.com/600x400'}" alt="Notícia">
      </a>
      <div class="card-body">
        <h3>${n.title}</h3>
        <div class="meta">
          <span>${formatarData(n.publishedAt)}</span>
          <a class="read" href="${n.url}" target="_blank">Ler →</a>
        </div>
      </div>
    </article>
  `).join('');
}

function formatarData(data) {
  if (!data) return "Agora";

  return new Date(data).toLocaleString("pt-BR", {
    dateStyle: "short",
    timeStyle: "short"
  });
}

function categoria(cat, el) {
  categoriaAtual = cat;

  document.querySelectorAll(".menu button").forEach(btn => {
    btn.classList.remove("active");
  });

  el.classList.add("active");

  renderizar();
}
</script>

</body>
</html>
