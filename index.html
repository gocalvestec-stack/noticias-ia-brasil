<body>


<header>

<div class="logo-area">

<img id="logoSite" src="" alt="Logo Notícias Brasil">

<h1 id="nomeSite">
Notícias Brasil
</h1>

</div>


<p>
Seu portal inteligente de notícias
</p>


</header>



<div class="menu">


<button onclick="categoria('todas')">
📰 Todas
</button>


<button onclick="categoria('futebol')">
⚽ Futebol
</button>


<button onclick="categoria('brasil')">
🇧🇷 Brasil
</button>


<button onclick="categoria('mundo')">
🌎 Mundo
</button>


<button onclick="categoria('tecnologia')">
💻 Tecnologia
</button>


<button onclick="categoria('economia')">
💰 Economia
</button>


<button onclick="modo()">
🌙
</button>


</div>



<div class="container">


<div id="destaque"></div>


<div id="anuncio"></div>


<h2>
Últimas notícias
</h2>


<div class="noticias" id="noticias">

Carregando notícias...

</div>


</div>



<script>


let noticias = [];

let categoriaAtual = "todas";



fetch("news.json")

.then(res => res.json())

.then(dados => {


noticias = dados.articles || [];

mostrar();


})

.catch(()=>{


document.getElementById("noticias").innerHTML =
"Não foi possível carregar as notícias.";


});



function embaralhar(lista){

return lista.sort(()=>Math.random()-0.5);

}




function mostrar(){


let lista=[...noticias];


lista = embaralhar(lista);



if(categoriaAtual !== "todas"){


lista = lista.filter(n=>{


let texto =
(n.title+" "+(n.description||""))
.toLowerCase();



if(categoriaAtual=="futebol")
return /futebol|gol|time|flamengo|cruzeiro|atletico|brasileirao/.test(texto);


if(categoriaAtual=="tecnologia")
return /tecnologia|celular|internet|ia/.test(texto);


if(categoriaAtual=="economia")
return /economia|dinheiro|mercado/.test(texto);


if(categoriaAtual=="brasil")
return /brasil|governo|política/.test(texto);


if(categoriaAtual=="mundo")
return /mundo|internacional/.test(texto);


});


}


let destaque = lista[0];



document.getElementById("destaque").innerHTML = `


<div class="destaque">


<img src="${destaque?.image || 'https://via.placeholder.com/800'}"
alt="${destaque?.title || 'Notícia'}">


<h1>

${destaque?.title || "Sem notícia disponível"}

</h1>


</div>


`;



let area=document.getElementById("noticias");


area.innerHTML="";



lista.forEach(n=>{


area.innerHTML += `


<div class="card">


<img src="${n.image || 'https://via.placeholder.com/400'}"
alt="${n.title}">


<div>


<h2>${n.title}</h2>


<p class="hora">

${data(n.publishedAt)}

</p>


<a href="${n.url}" target="_blank" rel="noopener noreferrer">

Ler notícia

</a>


</div>


</div>


`;


});



}
function data(d){

if(!d)
return "Data não informada";


return new Date(d)
.toLocaleString("pt-BR");

}



function categoria(c){

categoriaAtual=c;

mostrar();

}



function modo(){

document.body.classList.toggle("dark");

}



// Carrega configuração do site

fetch("config.json")

.then(res=>res.json())

.then(config=>{


// Logo

if(config.logo){

document.getElementById("logoSite").src=config.logo;

}



// Nome do site

if(config.nome){

document.getElementById("nomeSite").innerHTML=config.nome;

}



// Anúncio

if(config.anuncio && config.anuncio.ativo){


document.getElementById("anuncio").innerHTML=`

<div style="margin:20px 0">


<a href="${config.anuncio.link}" 
target="_blank"
rel="noopener noreferrer">


<img src="${config.anuncio.imagem}"

alt="Publicidade"

style="width:100%;border-radius:15px;">


</a>


</div>


`;


}



})

.catch(()=>{

console.log("Configuração não encontrada");

});



</script>
