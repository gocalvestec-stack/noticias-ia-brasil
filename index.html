<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9077847530409296" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RD NEWS - Portal de Notícias</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0f172a;
      --primary-accent: #2563eb;
      --accent: #dc2626;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-header: #0f172a;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    body.dark {
      --bg-body: #090d16;
      --bg-card: #111827;
      --bg-header: #030712;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #1f2937;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; }
    a { text-decoration: none; color: inherit; }

    .top-bar {
      background: rgba(0, 0, 0, 0.2);
      color: #94a3b8;
      font-size: 0.8rem;
      padding: 6px 20px;
      display: flex;
      justify-content: space-between;
    }

    header { background: var(--bg-header); color: white; padding: 24px 20px; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .logo-title { font-size: 1.8rem; font-weight: 800; color: #fff; }

    .menu-wrapper { position: sticky; top: 0; z-index: 100; background: var(--bg-card); border-bottom: 1px solid var(--border-color); }
    .menu { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .nav-links { display: flex; gap: 8px; overflow-x: auto; }
    .nav-item { border: none; background: transparent; color: var(--text-muted); padding: 16px 14px; font-weight: 600; cursor: pointer; }
    .nav-item.active { color: var(--primary-accent); font-weight: 700; border-bottom: 3px solid var(--primary-accent); }

    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .section-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; }

    .noticias-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
    
    .card-img-wrapper { width: 100%; height: 180px; overflow: hidden; background: #e2e8f0; }
    .card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    .card-body { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; }
    .card-meta { margin-top: auto; display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); padding-top: 12px; border-top: 1px solid var(--border-color); }
    .card-btn { color: var(--primary-accent); font-weight: 700; }
  </style>
</head>
<body>

  <div class="top-bar">
    <span id="dataAtual"></span>
    <span>RD NEWS • O seu portal de notícias</span>
  </div>

  <header>
    <div class="header-container">
      <h1 class="logo-title">RD NEWS</h1>
    </div>
  </header>

  <div class="menu-wrapper">
    <div class="menu">
      <nav class="nav-links">
        <button class="nav-item active" onclick="categoria('todas', this)">Todas</button>
        <button class="nav-item" onclick="categoria('futebol', this)">Futebol</button>
        <button class="nav-item" onclick="categoria('brasil', this)">Brasil</button>
        <button class="nav-item" onclick="categoria('mundo', this)">Mundo</button>
        <button class="nav-item" onclick="categoria('tecnologia', this)">Tecnologia</button>
      </nav>
    </div>
  </div>

  <main class="container">
    <h2 class="section-title" id="tituloSecao">Últimas Notícias</h2>
    <div class="noticias-grid" id="noticias"></div>
  </main>

  <script>
    let noticias = [];
    let categoriaAtual = "todas";
    const imagemFutebolPadrao = "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=800&q=80";

    document.getElementById("dataAtual").innerText = new Date().toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    fetch("news.json")
      .then(res => res.json())
      .then(dados => {
        noticias = dados.articles || [];
        mostrar();
      })
      .catch(() => {
        document.getElementById("noticias").innerHTML = "<p>Erro ao carregar notícias.</p>";
      });

    function mostrar() {
      const area = document.getElementById("noticias");
      const tituloSecao = document.getElementById("tituloSecao");
      area.innerHTML = "";

      let listaFiltrada = [...noticias];
      if (categoriaAtual !== "todas") {
        listaFiltrada = listaFiltrada.filter(n => {
          const cat = n.category || n.categoria || "";
          return cat.toLowerCase() === categoriaAtual.toLowerCase();
        });
        tituloSecao.innerText = `Notícias sobre ${categoriaAtual}`;
      } else {
        tituloSecao.innerText = "Últimas Notícias";
      }

      if (listaFiltrada.length === 0) {
        area.innerHTML = "<p>Nenhuma notícia encontrada nesta categoria.</p>";
        return;
      }

      listaFiltrada.forEach(n => {
        const catNoticia = (n.category || n.categoria || "").toLowerCase();
        const ehFutebol = catNoticia === "futebol";

        // Busca a URL da imagem no JSON
        let urlImagem = n.image || n.urlToImage || n.url_imagem;
        if (!urlImagem || urlImagem.trim() === "") {
          urlImagem = imagemFutebolPadrao;
        }

        // MONTA O HTML DA IMAGEM EXCLUSIVAMENTE SE FOR DA CATEGORIA FUTEBOL
        let htmlImagem = "";
        if (ehFutebol) {
          htmlImagem = `
            <a href="${n.url}" target="_blank" class="card-img-wrapper">
              <img src="${urlImagem}" alt="${n.title}" class="card-img" onerror="this.onerror=null; this.src='${imagemFutebolPadrao}';">
            </a>
          `;
        }

        area.innerHTML += `
          <article class="card">
            ${htmlImagem}
            <div class="card-body">
              <h3 class="card-title">${n.title}</h3>
              <div class="card-meta">
                <span>${n.publishedAt ? new Date(n.publishedAt).toLocaleDateString('pt-BR') : 'Recente'}</span>
                <a href="${n.url}" target="_blank" class="card-btn">Ler ➔</a>
              </div>
            </div>
          </article>
        `;
      });
    }

    function categoria(c, btn) {
      categoriaAtual = c;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      mostrar();
    }
  </script>
</body>
</html>
