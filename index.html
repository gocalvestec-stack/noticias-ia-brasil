<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Notícias IA Brasil</title>
  <style>
    body{
      font-family: Arial;
      margin:0;
      background:#f5f5f5;
    }
    header{
      background:#c40000;
      color:white;
      padding:16px;
      text-align:center;
    }
    .card{
      background:white;
      margin:12px;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 2px 8px rgba(0,0,0,.1);
    }
    .card img{
      width:100%;
    }
    .card h2{
      padding:10px;
      font-size:18px;
    }
    .card p{
      padding:0 10px 10px;
      color:#555;
    }
  </style>
</head>
<body>
  <header>
    <h1>📰 Notícias IA Brasil</h1>
  </header>

  <div id='news'></div>

  <script>
    async function carregar(){
      const r = await fetch('news.json');
      const noticias = await r.json();

      const div = document.getElementById('news');

      noticias.forEach(n=>{
        div.innerHTML += `
          <div class='card'>
            <img src='${n.image}'>
            <h2>${n.title}</h2>
            <p>${n.description}</p>
          </div>
        `;
      });
    }

    carregar();
  </script>
</body>
</html>
