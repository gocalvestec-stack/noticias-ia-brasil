name: Atualizar noticias

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar feedparser
        run: pip install feedparser

      - name: Buscar noticias RSS
        run: |
          python <<'PY'
          import json, feedparser, random
          from datetime import datetime

          feeds = {
              "futebol": "https://ge.globo.com/rss/ge/futebol/",
              "brasil": "https://g1.globo.com/rss/g1/",
              "economia": "https://g1.globo.com/rss/g1/economia/",
              "tecnologia": "https://www.tecmundo.com.br/rss",
              "mundo": "https://g1.globo.com/rss/g1/mundo/"
          }

          articles = []

          for categoria, url in feeds.items():
              feed = feedparser.parse(url)

              for item in feed.entries[:8]:
                  articles.append({
                      "title": item.get("title", "Sem título"),
                      "description": item.get("summary", "")[:200],
                      "url": item.get("link", "#"),
                      "image": "https://picsum.photos/600/400?random=" + str(random.randint(1,9999)),
                      "publishedAt": datetime.utcnow().isoformat() + "Z",
                      "category": categoria
                  })

          random.shuffle(articles)

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump({"articles": articles}, f, ensure_ascii=False, indent=2)
          PY

      - name: Salvar atualização
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news.json
          git commit -m "Atualiza noticias RSS" || exit 0
          git push
