name: Atualizar noticias

on:
  schedule:
    - cron: "0 */3 * * *"

  workflow_dispatch:

concurrency:
  group: atualizar-noticias
  cancel-in-progress: true

permissions:
  contents: write


jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4


      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Instalar bibliotecas
        run: |
          pip install feedparser requests beautifulsoup4


      - name: Buscar noticias RSS
        run: |

          python3 <<'PY'

          import json
          import feedparser
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime


          feeds = {

              "Futebol":
              "https://www.espn.com.br/rss/futebol",

              "Brasil":
              "https://g1.globo.com/rss/g1/",

              "Tecnologia":
              "https://feeds.feedburner.com/tecnoblog",

              "Economia":
              "https://g1.globo.com/rss/g1/economia/"

          }



          def pegar_imagem(item):

              # imagem RSS
              try:
                  if item.get("media_content"):
                      return item.media_content[0].get("url")
              except:
                  pass


              # thumbnail RSS
              try:
                  if item.get("media_thumbnail"):
                      return item.media_thumbnail[0].get("url")
              except:
                  pass


              # enclosure
              try:
                  if item.get("enclosures"):
                      return item.enclosures[0].get("url")
              except:
                  pass



              # buscar imagem na página
              try:

                  link = item.get("link")


                  resposta = requests.get(
                      link,
                      headers={
                          "User-Agent":"Mozilla/5.0"
                      },
                      timeout=10
                  )


                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  imagem = soup.find(
                      "meta",
                      property="og:image"
                  )


                  if imagem:
                      return imagem.get("content")


              except:
                  pass



              # imagem padrão
              return "https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=1200"



          articles = []



          for categoria, url in feeds.items():


              feed = feedparser.parse(url)



              for item in feed.entries[:10]:


                  articles.append({


                      "title":
                      item.get(
                          "title",
                          "Sem título"
                      ),


                      "description":
                      BeautifulSoup(
                          item.get("summary",""),
                          "html.parser"
                      ).text[:250],


                      "url":
                      item.get(
                          "link",
                          "#"
                      ),


                      "image":
                      pegar_imagem(item),


                      "publishedAt":
                      datetime.utcnow().isoformat()+"Z",


                      "category":
                      categoria


                  })



          with open(
              "news.json",
              "w",
              encoding="utf-8"
          ) as f:


              json.dump(
                  {
                      "articles":articles
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              f"{len(articles)} notícias atualizadas!"
          )


          PY



      - name: Commit das noticias
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add news.json

          git diff --cached --quiet || git commit -m "Atualizar noticias"



      - name: Enviar alterações
        run: |
          git push
