name: Atualizar noticias

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar arquivos
        uses: actions/checkout@v5


      - name: Buscar noticias
        run: |

          curl -L "https://gnews.io/api/v4/top-headlines?country=br&lang=pt&max=20&apikey=${{ secrets.GNEWS_API }}" -o news.json



      - name: Salvar atualização
        run: |

          git config user.name "github-actions"

          git config user.email "actions@github.com"

          git add news.json

          git commit -m "Atualiza noticias" || exit 0

          git push
