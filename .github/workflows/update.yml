name: Atualizar noticias

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: atualizar-noticias
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4


      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Instalar bibliotecas
        run: |
          pip install feedparser requests beautifulsoup4


      - name: Buscar noticias RSS
        run: |

          python3 <<'PY'

          import json
          import feedparser
          import requests
          import re

          from bs4 import BeautifulSoup
          from datetime import datetime


          feeds = {

              "Futebol":
              "https://www.espn.com.br/rss/futebol",

              "Brasil":
              "https://g1.globo.com/rss/g1/",

              "Tecnologia":
              "https://feeds.feedburner.com/tecnoblog",

              "Economia":
              "https://g1.globo.com/rss/g1/economia/"

          }


          def pegar_imagem(item):

              # imagem RSS media
              if "media_content" in item:
                  try:
                      return item.media_content[0]["url"]
                  except:
                      pass


              # thumbnail RSS
              if "media_thumbnail" in item:
                  try:
                      return item.media_thumbnail[0]["url"]
                  except:
                      pass


              # procura imagem dentro do html
              html = item.get("summary","")

              soup = BeautifulSoup(html,"html.parser")

              img = soup.find("img")

              if img and img.get("src"):
                  return img.get("src")


              return "https://via.placeholder.com/1200x700?text=Noticias"



          def limpar_texto(texto):

              soup = BeautifulSoup(texto,"html.parser")

              texto = soup.get_text(" ")

              texto = re.sub(
                  r'\s+',
                  ' ',
                  texto
              )

              return texto[:250]



          artigos=[]


          for categoria,url in feeds.items():

              print("Buscando:",categoria)

              feed = feedparser.parse(url)


              for item in feed.entries[:8]:

                  artigos.append({

                      "title":
                      item.get(
                          "title",
                          "Sem título"
                      ),


                      "description":
                      limpar_texto(
                          item.get(
                              "summary",
                              ""
                          )
                      ),


                      "url":
                      item.get(
                          "link",
                          "#"
                      ),


                      "image":
                      pegar_imagem(
                          item
                      ),


                      "publishedAt":
                      item.get(
                          "published",
                          datetime.utcnow().isoformat()+"Z"
                      ),


                      "category":
                      categoria

                  })



          with open(
              "news.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  {
                    "articles":artigos
                  },
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )



          print(
              f"{len(artigos)} noticias atualizadas!"
          )

          PY



      - name: Commit das noticias
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add news.json

          git diff --cached --quiet || git commit -m "Atualizar noticias"


      - name: Enviar alterações
        run: |

          git push
